{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:520px;">
  <p class="eyebrow">New</p>
  <h1>Task / Block</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Title</label><input name="title" required>
    <label>Description</label><textarea name="description" rows="2"></textarea>

    <label>Parent block (leave empty for top-level)</label>
    <select name="parent_id">
      <option value="">— none —</option>
      {% for p in parents %}<option value="{{ p.id }}">{{ p.title }}</option>{% endfor %}
    </select>

    <label>Skill category</label>
    <select name="skill_category_id">
      <option value="">— none —</option>
      {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select>

    <div class="grid grid-2">
      <div><label>Scheduled date</label><input type="date" name="scheduled_date"></div>
      <div><label>Recurrence</label>
        <select name="recurrence">
          <option value="none">One-time</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="indefinite">Indefinite</option>
        </select>
      </div>
    </div>
    <div class="grid grid-2">
      <div><label>Difficulty (1-5)</label><input type="number" name="difficulty" min="1" max="5" value="1"></div>
      <div><label>Base XP reward</label><input type="number" name="xp_reward_base" value="10"></div>
    </div>
    <button class="btn" type="submit">Create</button>
  </form>
</div>
{% endblock %}
