{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto;">
  <p class="eyebrow">Start your journey</p>
  <h1>Create Account</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>Username</label>{{ form.username() }}
    <label>Email</label>{{ form.email() }}
    <label>Password (min 10 chars)</label>{{ form.password() }}
    <label>Confirm password</label>{{ form.confirm() }}
    <button class="btn" type="submit" style="width:100%;">Create account</button>
  </form>
  <p style="margin-top:14px;color:var(--muted);font-size:.88rem;">
    Already playing? <a href="{{ url_for('auth.login') }}">Log in</a>
  </p>
</div>
{% endblock %}
