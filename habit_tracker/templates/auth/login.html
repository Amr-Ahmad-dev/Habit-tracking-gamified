{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto;">
  <p class="eyebrow">Welcome back</p>
  <h1>Enter the Quest</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>Username</label>{{ form.username() }}
    <label>Password</label>{{ form.password() }}
    <button class="btn" type="submit" style="width:100%;">Log in</button>
  </form>
  <p style="margin-top:14px;color:var(--muted);font-size:.88rem;">
    New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
